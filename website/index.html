<p>SN-Launcher is a Flutter launcher for tablets.</p>
<p>It updates itself: open <strong>Settings &rarr; Updates</strong> in the app and it
checks for a newer build, downloads it, checks that it is really signed by us,
and hands it to Android's installer. Until then, the releases page has the APKs.</p>
