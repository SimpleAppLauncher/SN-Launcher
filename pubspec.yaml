name: sn_launcher
description: >-
  SN-Launcher — a Google Nest Hub style launcher for Android and
  Unix/Linux desktops, tuned for low-RAM e-waste hardware.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  # In-app music player, per the user's request for "music from an adblock
  # capable browser". Only constructed when the music page opens — see
  # lib/src/widgets/music_player.dart and docs/MUSIC.md for the trade-offs.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Default photo-frame background. Regenerate with tool/fetch_photo.py; see
    # assets/photo/ATTRIBUTION.md for the author and licence.
    - assets/photo/landscape.jpg
    # Licence metadata, read at startup so the photographer's name can be
    # rendered on screen — required by the photo's licence.
    - assets/photo/landscape.json
    # Feature configuration. assets/features.json is the reduced default build;
    # assets/features.ef.json is the all-on ExtraFeature build. Both ship so one
    # checkout can produce either with a single --dart-define.
    - assets/features.json
    - assets/features.ef.json

  fonts:
    # The real Nest Hub uses Google Sans (SIL OFL since Dec 2025). Shipping
    # the genuine face is what makes the clock read as "Google" instantly.
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-700.ttf
          weight: 700
    # Used only for the optional "Timeless Light" clock face.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    # Google's own icon set (Apache 2.0), used via NestIcons.
    # NOT the upstream file: tool/build_icons.py subsets it to the 172 glyphs
    # this launcher draws and freezes the variable axes (FILL 0, GRAD 0,
    # opsz 24, wght 400), because Flutter's IconData cannot address variable
    # axes. 15 MB -> 35 KB.
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf